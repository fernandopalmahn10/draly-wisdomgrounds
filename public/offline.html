<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9fdcf7">
  <title>Sin conexión · Dralingo</title>
  <!-- Shown by sw.js when the home-screen app opens a page without internet. Self-contained (no outside files). -->
  <style>
    :root { --ink: #1d2440; --sky: #9fdcf7; --paper: #fff8ea; --gold: #ffc93c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: linear-gradient(180deg, var(--sky), #dff4ff); color: var(--ink);
      font: 800 1.05rem/1.35 "Nunito", system-ui, -apple-system, sans-serif; text-align: center; }
    .card { width: min(420px, 100%); background: var(--paper); border: 4px solid var(--ink); border-radius: 28px;
      padding: 18px 20px 24px; box-shadow: 0 8px 0 var(--ink); }
    img { width: 150px; height: auto; margin-top: -70px; filter: drop-shadow(0 6px 0 rgba(29, 36, 64, .18)); }
    h1 { font-size: 1.7rem; margin: 6px 0 4px; }
    p { margin: 0 0 18px; font-weight: 700; }
    button { width: 100%; min-height: 58px; border: 3px solid var(--ink); border-radius: 18px; background: var(--gold);
      color: var(--ink); font: 900 1.25rem "Nunito", system-ui, sans-serif; box-shadow: 0 5px 0 var(--ink); cursor: pointer; }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
    /* «← Volver» (the shared look of css/back.css, written here: this page loads no outside file) */
    .back { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px));
      display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 18px 0 14px; border: 2px solid var(--ink);
      border-radius: 999px; background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--ink); text-decoration: none;
      font: 800 16px/1 "Nunito", system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- ← 2026-10-18 (his rule: every screen has a way back): the page before, else the home page -->
  <a class="back" href="/" onclick="if (history.length > 1) { history.back(); return false; }">← Volver</a>
  <main class="card">
    <img src="/assets/dralingo/anim/wise-still.webp" alt="Dralingo">
    <h1>Sin conexión</h1>
    <p>Dralingo no encuentra internet. Revisa el wifi o los datos y vuelve a intentarlo.</p>
    <button type="button" onclick="location.reload()">🔄 Reintentar</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
