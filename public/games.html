<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- home-screen app (2026-10-12): manifest.webmanifest + sw.js + js/pwa.js -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dralingo">
  <title>Elige un juego · Draly Wisdom Grounds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <!-- Redesigned 2026-10-11 in the same sticker look as the home page and /packs.html (his brief: taste on the whole
       platform). Quiet page: no music. Games are a data list below; a new game = one entry in GAMES. -->
  <style>
    :root { --ink: #1d2440; --soft: #55607f; --paper: #fff7e3; --gold: #ffc93c; --mint: #c8f2dc; --blue: #2f7bea; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; color: var(--ink);
      background: linear-gradient(180deg, #9fdcf7 0%, #c6ecfb 55%, #ffd6e2 100%); }
    main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; }
    .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .back { font: inherit; font-weight: 800; color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
      border-radius: 14px; padding: 6px 14px; cursor: pointer; text-decoration: none; }
    .back:focus-visible, .play:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
    h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; margin: 0; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1; }
    .set { margin: 10px 0 0; font-weight: 800; color: var(--soft); }
    .set b { color: var(--ink); }
    h2 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.5rem; margin: 26px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .card { display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px; background: var(--paper); border: 4px solid var(--ink);
      border-radius: 24px; padding: 16px; box-shadow: 0 6px 0 var(--ink); }
    .head { display: flex; align-items: center; gap: 12px; }
    .emo { display: grid; place-items: center; width: 58px; height: 58px; flex: 0 0 58px; font-size: 2rem;
      background: #fff; border: 3px solid var(--ink); border-radius: 16px; }
    .name { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.45rem; line-height: 1.05; }
    .badge { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 800; padding: 1px 9px; border-radius: 999px;
      background: var(--gold); border: 2px solid var(--ink); }
    .desc { margin: 0; font-weight: 700; line-height: 1.35; color: var(--ink); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span { font-size: .85rem; font-weight: 800; color: var(--soft); background: #fff; border: 2px solid rgba(29,36,64,.2);
      border-radius: 999px; padding: 1px 10px; }
    .play { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--ink); min-height: 56px;
      background: var(--gold); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
      transition: transform .08s, box-shadow .08s; }
    .play:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
    .tool .play { background: var(--mint); }
    @media (prefers-reduced-motion: reduce) { .play { transition: none; } }
  </style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" id="back" href="/">← Inicio</a>
    <h1>Elige un juego</h1>
  </div>
  <p class="set" id="set-line">Primero el juego, después las preguntas.</p>

  <h2>🎮 Juegos con PIN</h2>
  <div class="grid" id="games"></div>
  <h2>🧑‍🏫 Herramientas de clase</h2>
  <div class="grid" id="tools"></div>
</main>

<script>
  // host: page that runs the game · game: id for /packs.html · noSet: content made by the game itself
  const GAMES = [
    // Ojos de Halcón (2026-10-13) replaced the first «Ojo de Halcón» (`look`, retired 2026-10-14).
    { id: 'halcon', emo: '🦅', name: 'Ojos de Halcón', badge: 'Nuevo', host: '/host-halcon.html', game: 'halcon',
      desc: 'El concurso de Dralingo en Dubái, en tableros de 4: la respuesta sale en una de las cuatro ventanas y cada alumno la mira con su personaje. +5 al más rápido de su tablero, luego +3, +2, +1; mirar la equivocada = 0.',
      tags: ['Tableros de 4', 'Reflejos', '1–40 jugadores'] },
    { id: 'escape', emo: '🚀', name: 'La Gran Fuga de Dubái', badge: 'Nuevo', host: '/host-escape.html', game: 'escape',
      desc: 'Toda la clase huye de Robotín por tres zonas de Dubái: cada respuesta correcta es un turbo y en la zona segura todos corren a una zona verde.',
      tags: ['Todos juntos', 'Persecución', '2–40 jugadores'] },
    { id: 'snow', emo: '❄️', name: 'Batalla de Nieve en Ski Dubái', badge: 'Nuevo', host: '/host-snow.html', game: 'snow',
      desc: 'Cada alumno camina por Dubái con su personaje: responde en las estaciones, lanza bolas de nieve y que no lo congelen. El Equipo Hielo crece hasta el final.',
      tags: ['Mapa', 'Todos contra el hielo', '2–40 jugadores'] },
    { id: 'paint', emo: '🎨', name: 'Dragones Pintores', badge: 'Nuevo', host: '/host-paint.html', game: 'paint',
      desc: 'Cada alumno vuela su dragón y pinta las nubes del color de su reino. Volar gasta fuego: responder bien lo recarga.',
      tags: ['Equipos', 'Plataformas', '2–40 jugadores'] },
    { id: 'kingdoms', emo: '🏰', name: 'Reinos de Colores', badge: 'Nuevo', host: '/host-kingdoms.html', game: 'kingdoms',
      desc: 'Cada respuesta correcta es una bandera para conquistar el mapa. Rodea zonas y encierra el castillo rival.',
      tags: ['Equipos', 'Estrategia', '2–40 jugadores'] },
    { id: 'mochi', emo: '🍡', name: 'Mochi Mash', badge: 'Nuevo', host: '/host.html', game: 'mochi-mash',
      desc: 'La Terraza del Mochi en Dubái, Fuego contra Mar: cada respuesta correcta da 5 segundos para tocar rápido y lanzarle mochis al dragoncito de tu equipo. Gana el que más come; al final, estrellas para los mejores.',
      tags: ['Equipos', 'Tocar rápido', '2–40 jugadores'] },
    { id: 'monopoly', emo: '🏯', name: 'Dàfùwēng · Monopolio Chino', host: '/host-monopoly.html', game: 'monopoly',
      desc: 'Un tablero de ciudades chinas: responde bien, tira el dado, compra ciudades y cobra renta.',
      tags: ['Equipos', 'Tablero', 'Dado'] },
    { id: 'dragon', emo: '🐉', name: 'Vuelo del Dragón', host: '/host-dragon.html', game: 'dragon-eye',
      desc: 'Cada respuesta correcta da 5 segundos de aleteo. El primer dragón que llega al cielo gana.',
      tags: ['Equipos', 'Carrera'] },
    { id: 'pinata', emo: '🐯', name: 'Piñata Tigre', host: '/host-pinata.html', game: 'pinata',
      desc: 'El primero que responde bien gana un golpe. Para el medidor en el punto justo: ¡golpe crítico!',
      tags: ['Equipos', 'Rapidez', '3–15 jugadores'] },
    { id: 'sixseven', emo: '🤙', name: '6-7 Swing', host: '/host-sixseven.html', noSet: true,
      desc: 'Matemáticas rápidas: cada respuesta es 6 o 7. Las cuentas se generan solas, no necesita preguntas.',
      tags: ['Matemáticas', 'Rapidez'] },
  ];
  const TOOLS = [
    { id: 'warmup', emo: '🎓', name: 'Modo Maestro', host: '/host-warmup.html', noSet: true, button: '🔒 Abrir Modo Maestro',
      desc: 'Construye oraciones en vivo con las palabras de HSK 1, un color por categoría. Pide contraseña.',
      tags: ['Calentamiento', 'Oraciones'] },
    { id: 'reading', emo: '📖', name: 'Lectura', host: '/host-reading.html', noSet: true, button: 'Abrir libro',
      desc: 'Un cuento en cada teléfono: tú pasas las páginas y las palabras se iluminan mientras se lee.',
      tags: ['Lectura', 'Audio', 'Pinyin'] },
  ];

  const setId = new URLSearchParams(location.search).get('setId');
  if (setId) {
    // Arrived from the uploaded-sets page: show which set, and Play goes straight to the game.
    document.getElementById('back').textContent = '← Series';
    document.getElementById('back').href = '/sets.html';
    fetch('/api/sets/' + encodeURIComponent(setId)).then((r) => r.json()).then((s) => {
      const line = document.getElementById('set-line');
      line.textContent = 'Serie: ';
      const b = document.createElement('b'); b.textContent = (s && s.title) || setId; line.appendChild(b);
    }).catch(() => {});
  }

  function card(g, tool) {
    const c = document.createElement('article');
    c.className = 'card' + (tool ? ' tool' : '');
    c.id = 'card-' + g.id;
    const head = document.createElement('div'); head.className = 'head';
    const emo = document.createElement('div'); emo.className = 'emo'; emo.textContent = g.emo; emo.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('div');
    const name = document.createElement('div'); name.className = 'name'; name.textContent = g.name; nm.appendChild(name);
    if (g.badge) { const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = g.badge; nm.appendChild(bd); }
    head.append(emo, nm);
    const desc = document.createElement('p'); desc.className = 'desc'; desc.textContent = g.desc;
    const tags = document.createElement('div'); tags.className = 'tags';
    g.tags.forEach((t) => { const s = document.createElement('span'); s.textContent = t; tags.appendChild(s); });
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'play';
    if (g.noSet) { btn.textContent = g.button || '▶ Jugar'; btn.onclick = () => { location.href = g.host; }; }
    else if (setId) { btn.textContent = '▶ Jugar con esta serie'; btn.onclick = () => { location.href = g.host + '?setId=' + encodeURIComponent(setId); }; }
    else { btn.textContent = 'Elegir preguntas →'; btn.onclick = () => { location.href = '/packs.html?game=' + encodeURIComponent(g.game); }; }
    c.append(head, desc, tags, btn);
    return c;
  }
  GAMES.forEach((g) => document.getElementById('games').appendChild(card(g, false)));
  TOOLS.forEach((g) => document.getElementById('tools').appendChild(card(g, true)));
</script>
<script src="/js/super-admin-badge.js?v=20261011c"></script>
  <script src="/js/pwa.js?v=20261012a" defer></script>
</body>
</html>
