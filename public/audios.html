  <!-- ← «Volver» (his rule 2026-10-18): always on screen (the band is sticky). Each view's own back link moves up here
       (js/audios.js); the picker goes back to where the visitor came from (Mis tareas, /maestro, else the home page). -->
  <header class="au-top">
    <a class="dw-back dw-back--dark au-top-back" id="au-top-back" href="/" aria-label="Volver al inicio">Volver</a>

  </header>

  <!-- Dralingo Dorado: a rare golden visitor (about one visit in ten; ?dorado=1 forces him, ?dorado=0 never).
       Nothing of it downloads on a normal visit; three.js comes from the CDN only when he appears. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    const ask = new URLSearchParams(location.search).get('dorado');
    // only on a homework's audio page (/audios/<level>-e<N>-r<N>, ?t=…): on a base his corner card would cover the seals
    // and the playing bar, on the picker the cards' ‹ › buttons, on a route its key box (css/ruta.css hides him there
    // too if the visitor moves on inside the page)
    const onHomework = /^\/audios?\/[a-z0-9]+-e\d+-r\d+\/?$/i.test(location.pathname) || new URLSearchParams(location.search).has('t');
    if (onHomework && (ask === '1' || (ask !== '0' && Math.random() < 0.1))) {
      setTimeout(() => {
        import('/js/golden/dorado.js?v=20261011a').then((m) => m.summon()).catch(() => {});
      }, ask === '1' ? 300 : 1400);
    }
  </script>
  <script src="/js/pwa.js?v=20261012a" defer></script>
