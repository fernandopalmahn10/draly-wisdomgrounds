<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- home-screen app (2026-10-12): manifest.webmanifest + sw.js + js/pwa.js -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dralingo">
  <meta name="theme-color" content="#5a1010">
  <title>Audios de las tareas · Dralingo</title>
  <meta name="description" content="Escucha cómo suena cada palabra y cada frase de tu tarea de Chino Mandarín.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/audios.css?v=20261012a">
</head>
<body>
  <header class="au-top">
    <a class="au-brand" href="/audios" data-nav="list" aria-label="Todas las tareas">
      <span class="au-word">DRALINGO</span>
      <span class="au-sub">Audios de las tareas</span>
    </a>
  </header>

  <main id="au-main" class="au-main" aria-live="polite">
    <p class="au-loading">Cargando tus tareas…</p>
  </main>

  <footer class="au-foot">
    <button class="au-install" type="button" data-pwa-install hidden>📲 Instalar la app de Dralingo</button>
    <p>Chino Mandarín para niños · Dralingo</p>
  </footer>

  <audio id="au-player" preload="none"></audio>
  <script src="/js/audios.js?v=20261011a"></script>
  <!-- Dralingo Dorado: a rare golden visitor (about one visit in ten; ?dorado=1 forces him, ?dorado=0 never).
       Nothing of it downloads on a normal visit; three.js comes from the CDN only when he appears. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    const ask = new URLSearchParams(location.search).get('dorado');
    if (ask === '1' || (ask !== '0' && Math.random() < 0.1)) {
      setTimeout(() => {
        import('/js/golden/dorado.js?v=20261011a').then((m) => m.summon()).catch(() => {});
      }, ask === '1' ? 300 : 1400);
    }
  </script>
  <script src="/js/pwa.js?v=20261012a" defer></script>
</body>
</html>
