<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Draly Wisdom Grounds</title>
  <meta name="theme-color" content="#9fdcf7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/home.css?v=20261011f">
</head>
<!-- Home redesigned 2026-10-11 (his brief): pastel sticker look from Reinos de Colores, Dralingo instead of Gojo,
     quiet page (no music, no sounds). Tap Dralingo for a random TikTok-style entrance (DralingoFX). -->
<body class="home" data-dfx-warm="tap">
  <main class="home-wrap">
    <section class="home-hero">
      <!-- The gang (his cast, 2026-10-11): two random members stand with Dralingo, a new pair on every visit. -->
      <div class="home-stage">
        <button class="home-cast" id="home-cast-a" type="button" hidden><img alt=""></button>
        <button class="home-dralingo" id="home-dralingo" type="button" aria-label="Dralingo. Tócalo para una sorpresa">
          <img id="home-dralingo-img" src="/assets/dralingo/anim/hello-still.webp" alt="" width="320" height="360">
          <span class="home-poke" aria-hidden="true">¡Tócame!</span>
        </button>
        <button class="home-cast" id="home-cast-b" type="button" hidden><img alt=""></button>
      </div>
      <h1 class="home-title">Draly Wisdom Grounds</h1>
      <p class="home-tagline">Donde la sabiduría echa a volar</p>
    </section>

    <!-- Homework first (most kids open the site at home in the evening), then the class PIN.
         On a phone both fit without scrolling. -->
    <section class="home-actions">
      <a href="/homework.html" class="home-hw">
        <span class="home-hw-icon" aria-hidden="true">📚</span>
        <span class="home-hw-text"><b>Hacer mis tareas</b><small>En casa, sin PIN</small></span>
        <span class="home-hw-go" aria-hidden="true">›</span>
      </a>
      <a href="/audios" class="home-hw home-audios" style="background:#ffe7a3">
        <span class="home-hw-icon" aria-hidden="true">🔊</span>
        <span class="home-hw-text"><b>Audios de las tareas</b><small>Escucha cómo suena tu tarea</small></span>
        <span class="home-hw-go" aria-hidden="true">›</span>
      </a>

      <div id="rematch-wrap" class="home-rematch" hidden>
        <button class="home-btn home-btn-gold" id="rematch-btn" type="button">🔄 Volver a la partida</button>
        <p class="home-rematch-sub" id="rematch-sub"></p>
      </div>

      <form class="home-join" id="home-join" novalidate>
        <h2 class="home-join-title">🎮 Entrar al juego</h2>
        <label class="home-sr" for="home-pin">PIN del juego</label>
        <input class="home-input home-input-pin" id="home-pin" type="tel" maxlength="4" placeholder="PIN"
               inputmode="numeric" autocomplete="off" enterkeyhint="next">
        <label class="home-sr" for="home-name">Tu nombre</label>
        <input class="home-input" id="home-name" type="text" maxlength="20" placeholder="Tu nombre"
               autocomplete="given-name" enterkeyhint="go">
        <button class="home-btn home-btn-go" id="home-join-btn" type="submit">¡Entrar!</button>
        <p class="home-error" id="home-error" role="alert"></p>
      </form>
    </section>
  </main>

  <footer class="home-foot">
    <a href="/games.html" class="home-teacher" id="host-link">👑 Maestros: crear un juego</a>
  </footer>

  <script src="/js/cast.js?v=20261011c"></script>
  <script src="/js/dralingo-fx.js?v=20261011f"></script>
  <script src="/js/super-admin-badge.js?v=20261011c"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    const goPlay = (pin, name) => {
      location.href = '/player.html?pin=' + encodeURIComponent(pin) + '&name=' + encodeURIComponent(name) + '&autojoin=1';
    };
    // 2026-10-12 — this card is THE join screen (the old «Únete» page in player.html is gone): the projector's
    // ?pin=X link and a failed join (?err=…) land here with the PIN filled in; ?pin + ?name goes straight in.
    const urlPin = (params.get('pin') || '').replace(/\D/g, '').slice(0, 4);
    const urlName = (params.get('name') || '').slice(0, 20);
    const urlErr = params.get('err');
    if (urlPin && urlName && !urlErr) goPlay(urlPin, urlName);

    // Rematch: a game joined in the last 4 hours on this device
    const REMATCH_KEY = 'dralyLastJoin';
    const REMATCH_MAX_AGE_MS = 4 * 60 * 60 * 1000;
    let saved = null;
    try { const raw = localStorage.getItem(REMATCH_KEY); if (raw) saved = JSON.parse(raw); } catch (e) { /* ignore */ }
    if (saved && saved.pin && saved.name && saved.ts && Date.now() - saved.ts < REMATCH_MAX_AGE_MS) {
      $('home-name').value = saved.name;
      // Only offer the rematch while that game is still open (a finished room would just show an error).
      fetch('/api/room-alive/' + encodeURIComponent(saved.pin))
        .then((r) => r.json())
        .then((d) => {
          if (!d || !d.alive) return;
          $('rematch-wrap').hidden = false;
          $('rematch-sub').textContent = 'Como ' + saved.name + ' · PIN ' + saved.pin;
          if (!urlPin) $('home-pin').value = saved.pin;   // a PIN from the projector link wins
          $('rematch-btn').onclick = () => goPlay(saved.pin, saved.name);
        })
        .catch(() => { /* offline: no rematch button */ });
    }

    // PIN from the projector link / a failed join: filled in, the name is the only thing left to type
    if (urlPin) {
      $('home-pin').value = urlPin;
      if (urlName) $('home-name').value = urlName;
      if (urlErr) $('home-error').textContent = urlErr.slice(0, 120);
      setTimeout(() => { const n = $('home-name'); (n.value ? $('home-join-btn') : n).focus(); }, 60);
      history.replaceState(null, '', '/');   // a reload doesn't repeat the error
    }

    // Join with the typed PIN + name
    $('home-pin').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
    $('home-pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('home-name').focus(); } });
    $('home-join').addEventListener('submit', (e) => {
      e.preventDefault();
      const pin = $('home-pin').value.trim();
      const name = $('home-name').value.trim();
      if (!pin || !name) {
        $('home-error').textContent = !pin ? 'Escribe el PIN que muestra tu maestro' : 'Escribe tu nombre';
        (!pin ? $('home-pin') : $('home-name')).focus();
        return;
      }
      $('home-error').textContent = '';
      goPlay(pin, name);
    });

    // Dralingo: the still pose shows at once; the animated loop (~1 MB, Higgsfield Kling clip keyed on this PC)
    // swaps in once the page has settled, so 30 phones joining a class at the same time are not slowed down.
    // A tap brings a random TikTok-style surprise (DralingoFX).
    const dr = $('home-dralingo');
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      const swapIn = () => setTimeout(() => {
        const anim = new Image();
        anim.onload = () => { $('home-dralingo-img').src = anim.src; };
        anim.src = '/assets/dralingo/anim/hello.webp';   // 2026-10-11: his new look (kandura + mustache)
      }, 1200);
      if (document.readyState === 'complete') swapIn(); else window.addEventListener('load', swapIn);
    }
    // Two members of the gang, a new combination each visit; tapping one brings their cameo with a hello line.
    if (window.DralingoCast) {
      DralingoCast.pick(2).forEach((id, k) => {
        const b = $(k ? 'home-cast-b' : 'home-cast-a');
        b.querySelector('img').onerror = () => { b.hidden = true; };   // a missing sticker never leaves a hole
        b.querySelector('img').src = DralingoCast.pose(id, 'hello');
        b.setAttribute('aria-label', DralingoCast.name(id) + ', ' + DralingoCast.role(id));
        b.hidden = false;
        b.addEventListener('click', () => {
          b.classList.remove('boing'); void b.offsetWidth; b.classList.add('boing');
          if (window.DralingoFX) DralingoFX.play('cameo', { char: id, mood: 'hello' });
        });
      });
    }
    const lines = ['¡Hola!', '¡A jugar!', '¡Tú puedes!', '¡Qué bueno verte!', '¡Vamos!', '¡Hoy aprendemos jugando!'];
    let lastLine = '';
    dr.addEventListener('click', () => {
      dr.classList.add('poked');
      dr.classList.remove('boing');
      void dr.offsetWidth;
      dr.classList.add('boing');
      const pool = lines.filter((l) => l !== lastLine);
      lastLine = pool[Math.floor(Math.random() * pool.length)];
      if (window.DralingoFX) DralingoFX.celebrate({ text: lastLine, mood: Math.random() < 0.5 ? 'good' : 'win' });
    });
  </script>
</body>
</html>
